{{ define "main" }}
  <div class="intro">
    <div class="prompt">{{ site.Params.prompt }}</div>
    <h1>{{ site.Title }}<span>_</span></h1>
    {{ .Content }}
  </div>

  {{ with (where site.RegularPages "Section" "posts") }}
    <div class="rows">
      {{ range first 5 . }}
        <a href="{{ .RelPermalink }}">
          <b>{{ .Date.Format "2006-01-02" }}</b><span>{{ .Title }}</span>
        </a>
      {{ end }}
    </div>
  {{ end }}
{{ end }}
