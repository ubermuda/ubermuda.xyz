<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0d;
    --fg: #e8e6e3;
    --mut: #7a7873;
    --line: #26262a;
    --acc: #7fd1a8;
  }
  [data-theme="light"] {
    --bg: #f6f6f4;
    --fg: #17181a;
    --mut: #6d6f6c;
    --line: #dededa;
    --acc: #1f7a52;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  a { color: inherit; text-decoration: none; }
  main {
    min-height: 100svh;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(24px, 6vh, 56px) 64px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(20px, 5vh, 48px);
    animation: fadeIn .5s ease both;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--mut);
  }
  header a:hover { color: var(--acc); }
  #theme {
    font: inherit;
    font-size: 13px;
    color: var(--mut);
    background: none;
    border: 1px solid var(--line);
    padding: 6px 12px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  #theme:hover { color: var(--acc); border-color: var(--acc); }
  .intro { align-self: center; animation: fadeUp .6s .05s ease both; }
  .prompt { font-size: 13px; color: var(--acc); margin-bottom: 20px; }
  h1 {
    font-size: clamp(38px, 8vw, 64px);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0 0 24px;
  }
  h1 span { color: var(--acc); }
  .intro p {
    font-size: 18px;
    line-height: 1.65;
    max-width: 640px;
    margin: 0;
    color: var(--mut);
  }
  nav, .rows {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-top: 1px solid var(--line);
    padding-top: 24px;
    font-size: 16px;
    animation: fadeUp .6s .15s ease both;
  }
  nav a, .rows a {
    display: flex;
    gap: 20px;
    padding: 9px 8px;
    margin: 0 -8px;
    transition: background .15s, color .15s;
  }
  nav a b, .rows a b {
    width: 100px;
    flex: none;
    font-weight: 400;
    color: var(--mut);
    transition: color .15s;
  }
  nav a:hover, .rows a:hover { background: var(--acc); color: var(--bg); }
  nav a:hover b, .rows a:hover b { color: var(--bg); }
  .content { align-self: start; animation: fadeUp .6s .05s ease both; }
  .content h1 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 12px; }
  .meta { font-size: 13px; color: var(--mut); margin-bottom: 32px; }
  .prose { font-size: 18px; line-height: 1.65; max-width: 640px; color: var(--mut); }
  .prose h2, .prose h3 { color: var(--fg); letter-spacing: -0.02em; margin: 40px 0 12px; }
  .prose h2 { font-size: 24px; }
  .prose h3 { font-size: 19px; }
  .prose a { color: var(--acc); text-decoration: underline; text-underline-offset: 3px; }
  .prose code {
    font-size: .9em;
    background: var(--line);
    color: var(--fg);
    padding: 2px 5px;
  }
  .prose pre {
    background: var(--line);
    padding: 16px;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  .prose pre code { background: none; padding: 0; }
  .prose .chroma { background: var(--line); color: var(--fg); }
  .prose .chroma .k, .prose .chroma .kd, .prose .chroma .kn, .prose .chroma .kr,
  .prose .chroma .s, .prose .chroma .s1, .prose .chroma .s2 { color: var(--acc); }
  .prose .chroma .c, .prose .chroma .c1, .prose .chroma .cm { color: var(--mut); font-style: italic; }
  .prose blockquote {
    margin: 24px 0;
    padding-left: 20px;
    border-left: 2px solid var(--acc);
  }
  .prose img { max-width: 100%; height: auto; }
  .empty { font-size: 18px; line-height: 1.65; color: var(--mut); margin: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 640px) {
    main { padding: clamp(24px, 5vh, 32px) 24px; }
    nav a, .rows a { gap: 12px; }
    nav a b, .rows a b { width: 78px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
