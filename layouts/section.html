{{ define "main" }}
  <div class="content">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  </div>

  {{ with .RegularPagesRecursive }}
    <div class="rows">
      {{ range . }}
        <a href="{{ .RelPermalink }}">
          <b>{{ .Date.Format "2006-01-02" }}</b><span>{{ .Title }}</span>
        </a>
      {{ end }}
    </div>
  {{ else }}
    <p class="empty">Nothing here yet.</p>
  {{ end }}
{{ end }}
